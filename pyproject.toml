[project]
name = "chapkit_minimalist_example_py"
version = "0.1.0"
description = "Minimalist Python example: scikit-learn LinearRegression on rainfall + mean_temperature, wrapped as a chapkit service."
requires-python = ">=3.13"
dependencies = [
    "chapkit>=0.24.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "joblib>=1.4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "uvicorn[standard]>=0.30.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
